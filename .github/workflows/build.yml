name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  # 静态检查：护栏 + lint（不启动 GUI）
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend deps
        run: cd frontend && npm install

      # 必须先构建前端：根包（main.go）用 //go:embed 嵌入 frontend/dist，
      # 而该目录被 gitignore —— 干净检出里没有它，编译根包会失败：
      #   `pattern all:frontend/dist: no matching files found`
      # 此前本 job 只 npm install 不构建，导致 check 每次必红。
      - name: Build frontend (供 go:embed 使用)
        run: cd frontend && npm run build

      - name: Run tests (含护栏)
        run: make test

      - name: Run lint
        run: make lint

  # 三平台编译矩阵（只编译，不启动 GUI）
  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend deps
        run: cd frontend && npm install

      # Linux 编译需要额外依赖（WebKit）
      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build
        run: make build

      # 生成器端到端验证：连生 2 个模块 → 生成 bindings → 编译 → gofmt → 护栏。
      # 这是本仓唯一的端到端检查，历史上抓到过 3 个真实 bug（缺 import / 注入非幂等 /
      # 产物不符 gofmt），此前只在本地跑、靠人记得。
      # 只在 ubuntu 腿跑一次即可（检查内容与平台无关），且 Windows runner 无 rsync。
      - name: Generator end-to-end (verify-gen)
        if: matrix.os == 'ubuntu-latest'
        run: make verify-gen

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: build/bin/
